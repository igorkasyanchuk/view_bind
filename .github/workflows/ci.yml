name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The supported range, since the fast path calls ActionView internals that move between
  # versions. Ruby 3.1 only pairs with Rails 7.1 in this matrix.
  test:
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.gemfile }}
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.4"]
        gemfile: ["gemfiles/rails_7.1.gemfile", "gemfiles/rails_7.2.gemfile",
                  "gemfiles/rails_8.0.gemfile", "Gemfile"]
        exclude:
          - ruby: "3.1"
            gemfile: "gemfiles/rails_8.0.gemfile"
          - ruby: "3.1"
            gemfile: "Gemfile"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

      # rake test boots the suite's own miniature app, so nothing above ever loads
      # benchmarks/app.rb. This boots it across the same Rails versions. Runnable locally as
      # `bundle exec rake smoke`; seeding the SQLite fixture takes about two seconds.
      - run: bundle exec rake smoke

  # One job owns the 100% gate: a version-guarded test is skipped on older Rails, which
  # would leave the branch it covers unreached there.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake coverage
